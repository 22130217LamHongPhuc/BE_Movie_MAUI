spring.application.name=demo

# DB
spring.datasource.url=jdbc:mysql://localhost:3306/maui?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate ? T? T?O B?NG
spring.jpa.hibernate.ddl-auto=update
# các giá tr? khác: create | create-drop | update | validate | none
# - create: xóa & t?o l?i b?ng m?i l?n ch?y
# - create-drop: nh? create nh?ng khi t?t app s? drop
# - update: ch? t?o/s?a c?t/b?ng n?u thi?u (an toàn h?n khi dev)
# - validate: ch? ki?m tra, không thay ??i schema

# Hi?n th? SQL cho d? debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect (th??ng Boot 3 t? ?oán, nh?ng có th? set tay)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
